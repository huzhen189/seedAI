# SeedAI 本地 bare 域名反代配置(开发用)
# 前置:
#   - hosts 已映射 seedai.huzhen.net.cn / seedapi.huzhen.net.cn -> 127.0.0.1
#   - 前端 vite dev 监听 7100, 业务监听 7101
#   - 以管理员运行 nginx(绑定 80)
# 启动: nginx -c <此文件绝对路径> -p <此文件所在目录>
# 停止: nginx -c <此文件绝对路径> -s stop

events {
    worker_connections 1024;
}

http {
    upstream frontend { server 127.0.0.1:7100; }
    upstream business { server 127.0.0.1:7101; }

    # 主站: 前端 SPA + 同源业务 API
    server {
        listen 80;
        server_name seedai.huzhen.net.cn;

        # 前端 SPA(vite dev, 含 HMR websocket)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 业务 API(SSE 流式)
        location /api/ {
            proxy_pass http://business;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # 鉴权(登录/注册/登出), 同源 Cookie 随请求携带
        location /auth/ {
            proxy_pass http://business;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        # 本地产物静态直出(P1: 生成文件先落本地, 浏览器同源拉取预览)。
        # 与 backend 平级的 artifacts/ 目录; alias 指向绝对路径, 关闭 autoindex 防目录遍历。
        # 安全(q-0): 加 auth_request 子请求鉴权, 拒绝软删/回收区/非 owner 私有项目直链越权读取。
        location /artifacts/ {
            # 捕获原始请求 URI(子请求共享父请求变量)供 auth 端点判定目标路径
            set $orig_uri $request_uri;
            auth_request /_artifacts_auth_check;
            # 鉴权失败透传给客户端(私有未登录→401, 软删/回收区/非owner→403)
            error_page 401 = @deny_artifacts;
            error_page 403 = @deny_artifacts;
            alias E:/work/myTencentYunHome/seedAI/artifacts/;
            autoindex off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            # HTML 以 text/html 直出, iframe 可内联预览
            default_type text/html;
            try_files $uri =404;
        }

        # 鉴权子请求: 把原始 URI 作为 query 参数透传给后端, 再放行/拒绝(200/401/403)
        location = /_artifacts_auth_check {
            internal;
            # auth_request 子请求默认不带 body, 用 X-Original-URI 透传目标路径
            proxy_set_header X-Original-URI $orig_uri;
            proxy_set_header Host $host;
            proxy_pass http://business/api/artifacts-auth;
            proxy_pass_request_body off;
            proxy_read_timeout 5s;
        }

        # 鉴权失败统一处理(返回 403, 不泄露原因细节)
        location @deny_artifacts {
            default_type application/json;
            return 403 '{"detail":"forbidden"}';
        }
    }

    # 预览沙箱域: 仅承载已发布产物 HTML(与主站同源 Cookie 隔离, 防 XSS 越权到主站)
    server {
        listen 80;
        server_name seedhtml.huzhen.net.cn;

        # 已发布产物(COS)经此域访问; 未发布产物走主站 /artifacts/ 直出(开发期)。
        # 若用独立 sandbox 域名托管 /artifacts/, 可在此也加一份 alias(生产建议)。
        location /artifacts/ {
            alias E:/work/myTencentYunHome/seedAI/artifacts/;
            autoindex off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            default_type text/html;
            try_files $uri =404;
        }
    }

    # 后端 bare 域名(API 调试直连)
    server {
        listen 80;
        server_name seedapi.huzhen.net.cn;

        location / {
            proxy_pass http://business;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
    }
}
