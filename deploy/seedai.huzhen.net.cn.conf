# SeedAI 对外站点: seedai.huzhen.net.cn (HTTP -> HTTPS 跳转 + HTTPS 终止)
# 前端 SPA(dist) + 反代 /api /auth 到 backend:7101 (SSE 关缓冲)
# 证书: 腾讯云 Nginx 版, 位于 /root/seedai.huzhen.net.cn/ (seedai.huzhen.net.cn_bundle.crt + .key)
# 命名遵循服务器既有规则(seedai.huzhen.net.cn.conf / game.huzhen.net.cn.conf / huzhen.net.cn.conf)。

# HTTP: 统一 301 跳转到 HTTPS
server {
    listen 80;
    server_name seedai.huzhen.net.cn;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name seedai.huzhen.net.cn;

    ssl_certificate     /root/seedai.huzhen.net.cn/seedai.huzhen.net.cn_bundle.crt;
    ssl_certificate_key /root/seedai.huzhen.net.cn/seedai.huzhen.net.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /home/huzhen/seedai/frontend/dist;
    index index.html;

    # SPA 历史回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务 API(含 SSE 流式)
    location /api/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 鉴权接口(登录/注册/登出), 同源 Cookie
    location /auth/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    # 本地组件库静态托管(域名根 /vendor/libs/...)。后端 7101 提供 /vendor/ 静态路由，
    # 透传即可;优先级高于 SPA 回退。长缓存。
    location /vendor/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    # 本地产物静态直出(同源预览): /artifacts/{uid}/{pid}/v{ver}/...
    # 契约见 backend/shared/artifacts.py: {ARTIFACT_DIR}/{uid}/{pid}/v{ver}/{fname}
    # 生产 ARTIFACT_DIR=/app/artifacts。每个请求先经 auth_request 子请求 (/api/artifacts-auth)
    # 做软删/回收区/公开or owner 鉴权, 防已隐藏/已删除项目被直链越权读取。
    location /artifacts/ {
        auth_request /api/artifacts-auth;
        # 把真实请求 URI 透传给鉴权子请求(它优先读 query path, X-Original-URI 兜底)
        proxy_set_header X-Original-URI $request_uri;
        alias /app/artifacts/;
        # 目录默认返回 index.html(单页站点产物);不存在由 try_files 接管
        index index.html;
        try_files $uri $uri/ =404;
        # HTML 不缓存(产物随时重建), 静态资源长缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?|json|map)$ {
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # auth_request 子请求专用内部端点(不可公网直接访问)
    location = /api/artifacts-auth {
        internal;
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_buffering off;
    }
}
