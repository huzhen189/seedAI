# SeedAI 对外站点: seedai.huzhen.net.cn (HTTP -> HTTPS 跳转 + HTTPS 终止)
# 前端 SPA(dist) + 反代 /api /auth 到 backend:7101 (SSE 关缓冲)
# 证书: 腾讯云 Nginx 版, 位于 /root/seedai.huzhen.net.cn/ (seedai.huzhen.net.cn_bundle.crt + .key)
# 命名遵循服务器既有规则(seedai.huzhen.net.cn.conf / game.huzhen.net.cn.conf / huzhen.net.cn.conf)。

# HTTP: 统一 301 跳转到 HTTPS
server {
    listen 80;
    server_name seedai.huzhen.net.cn;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name seedai.huzhen.net.cn;

    ssl_certificate     /root/seedai.huzhen.net.cn/seedai.huzhen.net.cn_bundle.crt;
    ssl_certificate_key /root/seedai.huzhen.net.cn/seedai.huzhen.net.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /home/huzhen/seedai/frontend/dist;
    index index.html;

    # SPA 历史回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务 API(含 SSE 流式)
    location /api/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 鉴权接口(登录/注册/登出), 同源 Cookie
    location /auth/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }
}
