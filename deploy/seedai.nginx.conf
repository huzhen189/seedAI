# SeedAI 生产 nginx 配置(部署到 /etc/nginx/conf.d/seedai.conf)
# 前端 SPA(dist) + 反代 /api /auth 到 backend:7101 (SSE 关缓冲)
# 注意: 本文件不含 HTTPS/域名; 如需 https 再叠加 cert+listen 443。
# 产物 /artifacts/ 走 COS(已在后端配置), 不在本机直出。

server {
    listen 7100;
    server_name _;

    root /opt/seedai/frontend/dist;
    index index.html;

    # SPA 历史回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务 API(SSE 流式)
    location /api/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 鉴权接口(登录/注册/登出), 与 /api 同源 Cookie
    location /auth/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # 本地组件库静态托管(域名根 /vendor/libs/...)。后端 7101 提供 /vendor/ 静态路由,
    # 透传即可;优先级高于 SPA 回退。长缓存。
    location /vendor/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }
}
