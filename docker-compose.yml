# SeedAI 本地/生产一体编排(单进程合并版, v2.0.0)。
# 架构变更(2026-07-26): 业务服务 + AI 核心已合并为【单一 FastAPI 进程】
# (backend/app,uicorn app.main:app,监听 7101)。不再有独立的 7102 AI 服务,
# 因此本 compose 也只有一个 backend 服务,前端 /api 反向代理直接打到 7101。
# 服务名即内网 DNS 主机名,与 .env 中 redis/mysql/chroma 一致。
# 前端(frontend/nginx)对外 7100;后端(backend)对外 7101。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: seedai-root
      MYSQL_DATABASE: seedai
      MYSQL_USER: seedai
      MYSQL_PASSWORD: seedai
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [seed-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pseedai-root"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    networks: [seed-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    volumes:
      - chroma_data:/chroma/chroma
    networks: [seed-net]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # M0 用 MySQL(aiomysql 异步驱动);本地直跑可用 .env 默认 SQLite
      DATABASE_URL: mysql+aiomysql://seedai:seedai@mysql:3306/seedai
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chroma:8000
      APP_PORT: 7101
    ports:
      - "7101:7101"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [seed-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "7100:80"
    depends_on:
      - backend
    networks: [seed-net]

volumes:
  mysql_data:
  redis_data:
  chroma_data:

networks:
  seed-net:
    driver: bridge
